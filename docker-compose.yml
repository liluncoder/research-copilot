# ★必须显式写项目名：Compose 默认拿仓库目录名当项目名，
#   而目录名「传智杯」全是非 ASCII 字符，会被剥成空串 ⇒
#   "project name must not be empty"。写死名称后，无论谁 clone 到哪个目录都能起。
name: research-copilot

services:
  backend:
    build: ./backend
    container_name: research-agent-backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - UPLOAD_DIR=/app/data/uploads
      - CHROMA_PERSIST_DIR=/app/chroma_data
    volumes:
      - ./data/uploads:/app/data/uploads
      - chroma_data:/app/chroma_data
      - ./tests/fixtures:/app/tests/fixtures:ro
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: research-agent-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  chroma_data:
